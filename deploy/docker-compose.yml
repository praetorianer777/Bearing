# The development and test stack. Run it through make (mk/stack.mk), which names the project and picks the host
# ports from the checkout's path; the defaults below are what a bare `docker compose` gets.
name: bearing

x-db-env: &db-env
  POSTGRES_USER: bearing
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bearing}
  POSTGRES_DB: bearing

# The api and the worker connect as bearing_app, which row level security constrains, and as bearing_admin for what
# runs before anybody acts.
x-app-env: &app-env
  BEARING_ENV: development
  BEARING_DB_PRIMARY_URL: postgres://bearing_app:${APP_DB_PASSWORD:-bearing_app}@postgres-primary:5432/bearing?sslmode=disable
  BEARING_DB_REPLICA_URLS: postgres://bearing_app:${APP_DB_PASSWORD:-bearing_app}@postgres-replica:5432/bearing?sslmode=disable
  BEARING_DB_ADMIN_URL: postgres://bearing_admin:${ADMIN_DB_PASSWORD:-bearing_admin}@postgres-primary:5432/bearing?sslmode=disable
  BEARING_VALKEY_URL: redis://:${VALKEY_PASSWORD:-bearing_valkey}@valkey:6379/0
  # The address people open, for the links in mail; Mailpit catches the mail.
  BEARING_APP_URL: http://localhost:${WEB_PORT:-5173}
  BEARING_SMTP_ADDR: mailpit:1025
  BEARING_MAIL_FROM: Bearing <bearing@bearing.test>
  # The stack's Keycloak under the issuer browsers see; the api reaches it inside the network. For development only.
  BEARING_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/dynamo
  BEARING_OIDC_CLIENT_ID: bearing
  BEARING_OIDC_CLIENT_SECRET: bearing-dev-secret
  BEARING_OIDC_BACKCHANNEL: http://localhost:${KEYCLOAK_PORT:-8180}=http://keycloak:8080

# The installation's first administrator, which the seed sets up. For development only.
x-bootstrap-env: &bootstrap-env
  BEARING_NAME: ${BEARING_NAME:-Demo organisation}
  BEARING_BOOTSTRAP_ADMIN_NAME: Ada Admin
  BEARING_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@bearing.test}
  BEARING_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-bearing admin password}
  # Let in ahead of their first single sign-on, as the suite's realm names them; carol and dave ask to join.
  BEARING_BOOTSTRAP_MEMBERS: alice@suite.test=administrator,bob@suite.test=member
  # Kestrel Works, the demo organisation, with alice, bob, carol and dave in it; false starts empty.
  BEARING_DEMO: ${BEARING_DEMO:-true}

# Every Go service runs the same image, which migrate alone builds: two builds racing to tag one name would fail the
# stack's start.
x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-bearing}-backend
  pull_policy: never

# What the images say they are; the Makefile sets both from scripts/build-stamp.sh, and a build without them calls
# itself VERSION+dev.
x-build-stamp: &build-stamp
  VERSION: ${BEARING_BUILD_VERSION:-}
  COMMIT: ${BEARING_BUILD_COMMIT:-}

services:
  postgres-primary:
    image: postgres:18-alpine
    environment:
      <<: *db-env
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-bearing_app}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-bearing_admin}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      # scram-sha-256 for replication connections as well as client ones.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      # Surfaces the standby's replay position on the primary, which the api's replica health check reads.
      - -c
      - track_commit_timestamp=on
      # A commit does not wait for its WAL to reach the disk; a crash loses under a second of writes, never
      # consistency. Never in a deployment.
      - -c
      - synchronous_commit=off
      - -c
      - log_lock_waits=on
    volumes:
      - primary-data:/var/lib/postgresql/18/docker
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP on purpose: the first-boot server listens on the socket only, so this passes once init has run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bearing -d bearing"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
      start_interval: 1s

  # A genuine streaming replica rather than a second database: read routing and the read-your-writes fallback only
  # mean something against real replication.
  postgres-replica:
    image: postgres:18-alpine
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      <<: *db-env
      PRIMARY_HOST: postgres-primary
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      REPLICATION_SLOT: bearing_replica_1
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    volumes:
      - replica-data:/var/lib/postgresql/18/docker
      - ./postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bearing -d bearing"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 1s

  # Read-your-writes positions, sessions and the worker's queue.
  valkey:
    image: valkey/valkey:8-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-bearing_valkey}
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:-bearing_valkey}"]
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s

  # Catches every outbound mail; nothing ever leaves the host. The image carries its own health check.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # The suite's identity provider and realm, so a person is one subject in Bearing and its siblings. The realm is
  # imported afresh on every start; the browser uses the published port, containers keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      # The image has no curl; bash can open a socket to the management port.
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf ''GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n'' >&3; grep -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
      start_interval: 2s

  # Migrations run as the database owner, which is what lets them create the runtime roles' default privileges.
  migrate:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: *build-stamp
    command: ["/app/migrate", "up"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      BEARING_DB_PRIMARY_URL: postgres://bearing:${POSTGRES_PASSWORD:-bearing}@postgres-primary:5432/bearing?sslmode=disable
    restart: "no"

  seed:
    <<: *backend
    command: ["/app/seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*app-env, *bootstrap-env]
    restart: "no"

  api:
    <<: *backend
    command: ["/app/api"]
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres-replica:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["/app/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      <<: *app-env
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: ${COMPOSE_PROJECT_NAME:-bearing}-web
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

volumes:
  primary-data:
  replica-data:
  valkey-data:
